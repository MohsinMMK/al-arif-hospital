<!doctype html>
<!--
  The link-preview card (public/og-image.png) shown when the site is shared on WhatsApp, X,
  Facebook, LinkedIn and in search. Centred, so square crops (WhatsApp's small preview) keep the logo.
  Regenerate after editing, from preview/:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=public/og-image.png "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2")
          format("woff2");
        font-weight: 500;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #1c3a13;
        font-family: "Inter Tight", sans-serif;
        text-align: center;
        background:
          radial-gradient(60% 70% at 85% 20%, #f6f8f0 0%, transparent 70%),
          radial-gradient(70% 90% at 8% 100%, #c3d5ae 0%, transparent 70%),
          linear-gradient(180deg, #e9f0df 0%, #d9e5ca 100%);
      }
      img {
        width: 168px;
        height: 224px;
        filter: drop-shadow(0 18px 30px #1c3a1333);
      }
      p {
        margin: 26px 0 0;
        font: 500 17px/1 "IBM Plex Mono", monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #55754a;
      }
      h1 {
        margin: 14px 0 0;
        font-size: 54px;
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.035em;
      }
      ul {
        display: flex;
        gap: 12px;
        margin: 28px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        padding: 11px 20px;
        border-radius: 999px;
        background: rgb(252 252 247 / 0.7);
        box-shadow: inset 0 0 0 1px #1c3a131a;
        font-size: 20px;
        font-weight: 600;
      }
      li:first-child {
        background: #1c3a13;
        color: #fcfcf7;
      }
    </style>
  </head>
  <body>
    <img src="../public/al-arif-logo-gradient.svg" alt="" />
    <p>Bandlaguda · Hyderabad · Since 2002</p>
    <h1>Al-Arif General Hospital<br />&amp; Unani Research Institute</h1>
    <ul>
      <li>Open 24 hours</li>
      <li>General &amp; Unani care</li>
      <li>₹10 OPD fee</li>
    </ul>
  </body>
</html>
