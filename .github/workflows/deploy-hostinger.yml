# Build the site and upload it to Hostinger (alarifgeneralhospital.com) on every push to main.
# Tests and lint must pass before anything is uploaded.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two uploads at once; a newer push waits for the current one to finish.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - run: npm --prefix preview ci
      - run: npm --prefix preview test
      - run: npm --prefix preview run lint
      - run: npm --prefix preview run build

      # Hostinger's FTPS server drops the connection when the deploy action asks for a sync state
      # file that doesn't exist yet, so seed an empty one (meaning "upload everything") when missing.
      - name: Seed the sync state file on first deploy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://$FTP_SERVER/.ftp-deploy-sync-state.json"
          if ! curl -sf --ssl-reqd -k -u "$FTP_USERNAME:$FTP_PASSWORD" "$url" -o /dev/null; then
            echo '{"description":"ftp-deploy sync state","version":"1.0.0","generatedTime":0,"data":[]}' |
              curl -sS --ssl-reqd -k -u "$FTP_USERNAME:$FTP_PASSWORD" -T - "$url"
          fi

      # Uploads only files that changed since the last deploy (tracked in a state file on the server).
      # Hostinger's FTP certificate is issued for *.hstgr.io, not this IP, so TLS is used without
      # hostname verification ("loose") — still encrypted, unlike plain FTP.
      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./preview/dist/
          # The domain's FTP account already opens inside public_html.
          server-dir: ./
